# Sugar/ethanol mill near Parapua, Sao Paulo, Brazil.
# Centroid verified against Sentinel-2 true colour 2023-07-21 (figs/parapua/site_verification.png):
# compact mill (process buildings, bagasse yard, vinasse ponds) surrounded by cane fields.
site:
  name: parapua_mill
  description: "Sugarcane mill, Parapua municipality, Sao Paulo state, Brazil"
  centroid:
    lat: -21.913897
    lon: -50.8671483
  plant_box_km: 1.2
  ring_inner_km: 2.5
  ring_outer_km: 5.0
  ring_landcover_classes: [30, 40, 60]

time:
  start: "2015-01-01"
  end: null

grid:
  crs: "EPSG:32722"
  resolution: 30

landsat:
  collection: "landsat-c2-l2"
  platforms: ["landsat-8", "landsat-9"]
  bands: ["lwir11", "qa_pixel"]
  st_scale: 0.00341802
  st_offset: 149.0
  qa_bad_bits: [1, 3, 4, 5]

features:
  min_clear_frac_plant: 0.70
  min_clear_ring_px: 200
  hot_thresh_c: 5.0
  core:
    sun_elev_max: 30    # at -21.9 deg the overpass sun never gets this low ->
    min_low_sun_scenes: 8   # detection skips and the signal falls back to anomaly
    p90_thresh_c: 2.0
    std_thresh_c: 1.5
    min_obs: 8
    min_core_px: 20

classify:
  # Crush campaigns ARE seasonal (Apr-Nov), so seasonal control would absorb the
  # state signal - use the plain GMM on the raw anomaly (the brief's original model).
  model: raw_gmm
  posterior_thresh: 0.80
  min_separation_c: 3.0
  marginal_separation_c: 1.0
  seasonal_harmonics: 2
  smooth_window: 3
  smooth_posterior_thresh: 0.65

modis:
  enabled: false

paths:
  cache_dir: "data/cache_parapua"
  parquet: "data/parapua_thermal.parquet"
  figs_dir: "figs/parapua"
  outputs_dir: "outputs/parapua"
  events: "data/parapua_events.csv"
