# NZ milk-powder dryer pilot: 26 sites from data/nz_dryers.csv.
# Dairy sites are compact (single dryer/boiler block) -> sugar-mill-sized box.
# Season: milk Aug-May, winter dry-off Jun-Jul = built-in on/off ground truth.
fleet:
  box_km: 1.2
  pad_km: 0.4
  min_clear_frac_box: 0.6
  min_scenes_mill: 40
  core_px: 40             # dryer+boiler block is smaller than a mill boiler house
  core_min_obs: 8
  core_min_clear_px: 4

time:
  start: "2014-01-01"     # longer baseline; L8 available from mid-2013
  end: null

landsat:
  collection: "landsat-c2-l2"
  platforms: ["landsat-8", "landsat-9"]
  bands: ["lwir11", "qa_pixel"]
  st_scale: 0.00341802
  st_offset: 149.0
  qa_bad_bits: [1, 3, 4, 5]

paths:
  cache_dir: "data/cache_nz"
